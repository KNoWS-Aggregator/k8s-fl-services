[project]
name = "fl-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keras",
    "tensorflow",
    "tensorflow-probability",
    "tf_keras",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
