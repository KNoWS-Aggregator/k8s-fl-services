apiVersion: aggregator.example.org/v1alpha1
kind: ServiceDefinition
metadata:
  name: federated-training-client

spec:
  prefixes:
    aggr: https://w3id.org/aggregator#
    dcat: http://www.w3.org/ns/dcat#
    dct: http://purl.org/dc/terms/
    fnoc: https://fno.io/vocabulary/composition/0.1.0/
    hydra: http://www.w3.org/ns/hydra/core#
    xsd: http://www.w3.org/2001/XMLSchema#

  functions:
    prepare:
      fnoDescriptionRef:
        name: federated-training-client-prepare

    train:
      fnoDescriptionRef:
        name: federated-training-client-train

    evaluate:
      fnoDescriptionRef:
        name: federated-training-client-evaluate

  composition:
    - from:
        function: prepare
        output: preparedDataOutput
      to:
        function: train
        parameter: preparedDataInput

    - from:
        function: train
        output: evaluationDataOutput
      to:
        function: evaluate
        parameter: evaluationDataInput

  metadata:
    title: Federated training client
    description: >
      Prepares hospital data, trains local model weights, and evaluates
      aggregated model weights.

  endpoints:
    prepare:
      path: /prepare
      targetPort: preparation
      operations:
        - method: POST
          executes: prepare

    prepared-data:
      path: /results
      targetPort: preparation
      operations:
        - method: GET
          returnsOutputs:
            - function: prepare
              output: preparedDataOutput

    session-start:
      path: /session/start
      targetPort: training
      operations:
        - method: POST
          updatesParameters:
            - function: train
              parameter: sessionId
            - function: train
              parameter: clientId
            - function: train
              parameter: expectedRounds
            - function: train
              parameter: trainingConfig

    train:
      path: /train
      targetPort: training
      operations:
        - method: POST
          executes: train
          updatesParameters:
            - function: train
              parameter: roundId
            - function: train
              parameter: replyUrl
            - function: train
              parameter: globalWeights

    weights:
      path: /weights
      targetPort: training
      operations:
        - method: GET
          returnsOutputs:
            - function: train
              output: clientWeights

    training-metrics:
      path: /metrics
      targetPort: training
      operations:
        - method: GET
          returnsOutputs:
            - function: train
              output: trainingMetrics

    evaluate:
      path: /evaluate
      targetPort: training
      operations:
        - method: POST
          executes: evaluate
          updatesParameters:
            - function: evaluate
              parameter: roundId
            - function: evaluate
              parameter: replyUrl
            - function: evaluate
              parameter: globalWeights

    evaluation-metrics:
      path: /evaluation-metrics
      targetPort: training
      operations:
        - method: GET
          returnsOutputs:
            - function: evaluate
              output: evaluationMetrics

    session-end:
      path: /session/end
      targetPort: training
      operations:
        - method: POST
          updatesParameters:
            - function: train
              parameter: sessionId
            - function: train
              parameter: clientId
            - function: train
              parameter: expectedRounds
            - function: train
              parameter: trainingConfig

  datasets:
    prepared-data:
      output:
        function: prepare
        name: preparedDataOutput
      title: Prepared hospital data
      description: >
        Aggregated Parquet data prepared from the hospital slice.
      distribution:
        title: Prepared data archive
        endpointRef: prepared-data
        urlProperty: dcat:downloadURL
        mediaType: application/zip

    client-weights:
      output:
        function: train
        name: clientWeights
      title: Client model weights
      description: Model weights produced by local training.
      distribution:
        title: Client weights
        endpointRef: weights
        urlProperty: dcat:downloadURL
        mediaType: application/octet-stream

    training-metrics:
      output:
        function: train
        name: trainingMetrics
      title: Training metrics
      distribution:
        endpointRef: training-metrics
        urlProperty: dcat:accessURL
        mediaType: application/json

    evaluation-data:
      output:
        function: train
        name: evaluationDataOutput
      title: Internal evaluation data
      description: >
        Prepared evaluation data consumed internally by the evaluate function.

    evaluation-metrics:
      output:
        function: evaluate
        name: evaluationMetrics
      title: Evaluation metrics
      distribution:
        endpointRef: evaluation-metrics
        urlProperty: dcat:accessURL
        mediaType: application/json

  orchestration:
    primaryResource: workload

    inputBindings:
      - function: prepare
        parameter: sources
        variable: SOURCES
      - function: prepare
        parameter: dataset
        variable: DATASET
      - function: prepare
        parameter: authn
        variable: AUTHN
      - function: prepare
        parameter: pollEnabled
        variable: POLL_ENABLED
      - function: prepare
        parameter: pollInterval
        variable: POLL_INTERVAL

    resources:
      - id: storage
        manifest:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: federated-training-client-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi

      - id: workload
        manifest:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: federated-training-client
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: federated-training-client
            template:
              metadata:
                labels:
                  app: federated-training-client
              spec:
                securityContext:
                  fsGroup: 65532

                containers:
                  - name: data-preparation
                    image: ghcr.io/knows-aggregator/data-preparation:latest
                    ports:
                      - name: preparation
                        containerPort: 8080
                    env:
                      - name: SOURCES
                        value: "$(SOURCES)"
                      - name: DATASET
                        value: "$(DATASET)"
                      - name: AUTHN
                        value: "$(AUTHN)"
                      - name: POLL_ENABLED
                        value: "$(POLL_ENABLED)"
                      - name: POLL_INTERVAL
                        value: "$(POLL_INTERVAL)"
                      - name: DATA_DIR
                        value: /app/data
                    volumeMounts:
                      - name: data
                        mountPath: /app/data

                  - name: model-training
                    image: ghcr.io/knows-aggregator/model-training:latest
                    ports:
                      - name: training
                        containerPort: 8081
                    env:
                      - name: PORT
                        value: "8081"
                      - name: DATA_DIR
                        value: /app/data
                    volumeMounts:
                      - name: data
                        mountPath: /app/data

                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: federated-training-client-data
