apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicedefinitions.aggregator.example.org
spec:
  group: aggregator.example.org
  scope: Namespaced

  names:
    plural: servicedefinitions
    singular: servicedefinition
    kind: ServiceDefinition
    shortNames:
      - svcdef

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec

          properties:
            spec:
              type: object
              additionalProperties: false
              required:
                - functions
                - endpoints
                - orchestration

              properties:
                prefixes:
                  type: object
                  description: RDF prefixes used throughout the definition.
                  additionalProperties:
                    type: string
                    format: uri

                functions:
                  type: object
                  minProperties: 1
                  description: >
                    Local aliases for the FnO functions performed by this
                    service.
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required:
                      - fnoDescriptionRef
                    properties:
                      fnoDescriptionRef:
                        type: object
                        additionalProperties: false
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            minLength: 1
                          namespace:
                            type: string
                            minLength: 1

                composition:
                  type: array
                  description: >
                    Internal connections between function outputs and
                    parameters.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - from
                      - to
                    properties:
                      from:
                        type: object
                        additionalProperties: false
                        required:
                          - function
                          - output
                        properties:
                          function:
                            type: string
                            minLength: 1
                          output:
                            type: string
                            minLength: 1

                      to:
                        type: object
                        additionalProperties: false
                        required:
                          - function
                          - parameter
                        properties:
                          function:
                            type: string
                            minLength: 1
                          parameter:
                            type: string
                            minLength: 1

                metadata:
                  type: object
                  additionalProperties: false
                  description: >
                    Metadata added to the generated dcat:DataService. Fixed RDF
                    types and runtime facts are generated by the platform.
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    custom:
                      type: object
                      additionalProperties:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            iri:
                              type: string
                              minLength: 1
                            literal:
                              type: string
                            language:
                              type: string
                              minLength: 1
                            datatype:
                              type: string
                              minLength: 1
                          x-kubernetes-validations:
                            - rule: "has(self.iri) != has(self.literal)"
                              message: >
                                Exactly one of iri or literal must be present.
                            - rule: >
                                !(has(self.language) && has(self.datatype))
                              message: >
                                A value cannot have both language and datatype.
                            - rule: >
                                !has(self.iri) ||
                                (!has(self.language) && !has(self.datatype))
                              message: >
                                An IRI cannot have language or datatype.

                endpoints:
                  type: object
                  minProperties: 1
                  description: >
                    Semantic HTTP endpoints and their workload routing targets.
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required:
                      - path
                      - targetPort
                      - operations
                    properties:
                      path:
                        type: string
                        pattern: "^/"
                        description: Path exposed below the service root.

                      internalPath:
                        type: string
                        pattern: "^/"
                        description: >
                          Path used when forwarding to the workload. Defaults
                          to path when omitted.

                      protocol:
                        type: string
                        enum:
                          - http
                          - https
                        default: http

                      targetPort:
                        x-kubernetes-int-or-string: true
                        anyOf:
                          - type: integer
                            minimum: 1
                            maximum: 65535
                          - type: string
                            minLength: 1
                        description: >
                          Port number or named workload port to which the
                          endpoint is routed.

                      operations:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - method
                          properties:
                            method:
                              type: string
                              enum:
                                - GET
                                - POST
                                - PUT
                                - PATCH
                                - DELETE

                            executes:
                              type: string
                              minLength: 1
                              description: Local function alias.

                            updatesParameters:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                  - function
                                  - parameter
                                properties:
                                  function:
                                    type: string
                                    minLength: 1
                                  parameter:
                                    type: string
                                    minLength: 1

                            returnsOutputs:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                  - function
                                  - output
                                properties:
                                  function:
                                    type: string
                                    minLength: 1
                                  output:
                                    type: string
                                    minLength: 1

                            returnsParameters:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                  - function
                                  - parameter
                                properties:
                                  function:
                                    type: string
                                    minLength: 1
                                  parameter:
                                    type: string
                                    minLength: 1

                datasets:
                  type: object
                  description: >
                    Dataset templates used when describing a running service.
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required:
                      - output
                    properties:
                      output:
                        type: object
                        additionalProperties: false
                        required:
                          - function
                          - name
                        properties:
                          function:
                            type: string
                            minLength: 1
                          name:
                            type: string
                            minLength: 1

                      title:
                        type: string

                      description:
                        type: string

                      custom:
                        type: object
                        additionalProperties:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              iri:
                                type: string
                                minLength: 1
                              literal:
                                type: string
                              language:
                                type: string
                                minLength: 1
                              datatype:
                                type: string
                                minLength: 1
                            x-kubernetes-validations:
                              - rule: "has(self.iri) != has(self.literal)"
                                message: >
                                  Exactly one of iri or literal must be
                                  present.
                              - rule: >
                                  !(has(self.language) &&
                                  has(self.datatype))
                                message: >
                                  A value cannot have both language and
                                  datatype.
                              - rule: >
                                  !has(self.iri) ||
                                  (!has(self.language) &&
                                  !has(self.datatype))
                                message: >
                                  An IRI cannot have language or datatype.

                      distribution:
                        type: object
                        additionalProperties: false
                        required:
                          - endpointRef
                          - urlProperty
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                          endpointRef:
                            type: string
                            minLength: 1
                          urlProperty:
                            type: string
                            enum:
                              - dcat:accessURL
                              - dcat:downloadURL
                          mediaType:
                            type: string
                          format:
                            type: string
                          custom:
                            type: object
                            additionalProperties:
                              type: array
                              minItems: 1
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  iri:
                                    type: string
                                    minLength: 1
                                  literal:
                                    type: string
                                  language:
                                    type: string
                                    minLength: 1
                                  datatype:
                                    type: string
                                    minLength: 1
                                x-kubernetes-validations:
                                  - rule: >
                                      has(self.iri) != has(self.literal)
                                    message: >
                                      Exactly one of iri or literal must be
                                      present.
                                  - rule: >
                                      !(has(self.language) &&
                                      has(self.datatype))
                                    message: >
                                      A value cannot have both language and
                                      datatype.
                                  - rule: >
                                      !has(self.iri) ||
                                      (!has(self.language) &&
                                      !has(self.datatype))
                                    message: >
                                      An IRI cannot have language or datatype.

                orchestration:
                  type: object
                  additionalProperties: false
                  required:
                    - primaryResource
                    - resources
                  properties:
                    primaryResource:
                      type: string
                      minLength: 1
                      description: >
                        Resource ID of the Deployment, Job, or CronJob used to
                        determine the service lifecycle.

                    inputBindings:
                      type: array
                      description: >
                        Deployment-time FnO parameters substituted into all
                        orchestration manifests.
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - function
                          - parameter
                          - variable
                        properties:
                          function:
                            type: string
                            minLength: 1
                          parameter:
                            type: string
                            minLength: 1
                          variable:
                            type: string
                            pattern: "^[A-Z_][A-Z0-9_]*$"

                    resources:
                      type: array
                      minItems: 1
                      description: >
                        Complete namespaced Kubernetes objects. The platform
                        injects namespace and ownership metadata.
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - id
                          - manifest
                        properties:
                          id:
                            type: string
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                          manifest:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
