[project]
name = "weight-aggregation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastapi>=0.110",
    "fl-model",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
