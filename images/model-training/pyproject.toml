# images/model-training/pyproject.toml
[project]
name = "model-training"
version = "0.1.0"
dependencies = [
    "common",
    "fl-model",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-multipart>=0.0.9",
    "tsflex>=0.4",
    "uvicorn>=0.29",
    "keras",
    "tensorflow",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
