[project]
name = "data-preparation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "croniter>=3.0",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "pyarrow>=16",
    "requests>=2.31",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
