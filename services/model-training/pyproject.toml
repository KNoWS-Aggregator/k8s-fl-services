# services/model-training/pyproject.toml
[project]
name = "model-training"
version = "0.1.0"
dependencies = [
    "common",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "keras",
    "tensorflow",
    "tensorflow-probability",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]